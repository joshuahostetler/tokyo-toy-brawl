<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tokyo Toy Brawl</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐼</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="lobby">
    <form id="lobby-form" class="card">
      <h1>Tokyo Toy Brawl <span>トーキョー</span></h1>
      <p class="tagline">Soak, splat and bonk your friends across a toy-sized Tokyo. No one gets hurt — just very, very wet.</p>
      <div class="lobby-grid">
        <div>
          <label for="name">Your name</label>
          <input id="name" maxlength="16" placeholder="e.g. Mochi Master" autocomplete="off" />
          <label>Pick your animal</label>
          <div id="animal-picker"></div>
          <button id="play" type="submit">Join the brawl!</button>
          <p id="lobby-error" role="alert"></p>
        </div>
        <canvas id="preview"></canvas>
      </div>
      <div class="controls">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
        <span><kbd>Space</kbd> jump</span>
        <span><kbd>Shift</kbd> sprint</span>
        <span><kbd>Right click</kbd> hold to aim</span>
        <span><kbd>Left click</kbd> shoot</span>
        <span><kbd>1</kbd>–<kbd>5</kbd> / wheel switch weapon</span>
        <span><kbd>E</kbd> enter/exit vehicle</span>
        <span><kbd>V</kbd> third person</span>
        <span><kbd>Tab</kbd> scores</span>
      </div>
    </form>
  </div>

  <div id="hud" hidden>
    <div id="crosshair"><i></i><i></i><i></i><i></i></div>
    <div id="hitmarker">✕</div>
    <div id="vignette"></div>
    <div id="killfeed"></div>
    <canvas id="minimap" width="180" height="180"></canvas>
    <div id="health"><div id="health-fill"></div><span id="health-text">100</span></div>
    <div id="weapon"><div id="weapon-name"></div><div id="ammo"></div></div>
    <div id="slots"></div>
    <div id="prompt" hidden></div>
    <div id="center-msg" hidden></div>
    <div id="scoreboard" hidden></div>
    <div id="click-to-play" hidden>Click to play</div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
